<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraform IaC Project</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      max-width: 600px;
      margin: 20px;
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }
    h1 { color: #6c47ff; }
    .status { color: #15803d; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Terraform IaC Project</h1>
    <p class="status">Successfully Deployed!</p>
    <p>This Nginx container was provisioned using Terraform and Docker.</p>
    <p>Infrastructure as Code makes deployment repeatable and manageable.</p>
  </div>
</body>
</html>
